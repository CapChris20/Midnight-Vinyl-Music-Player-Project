<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frank Ocean — Midnight Vinyl</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="player.css" />
</head>
<body class="artist-page" data-artist="frank-ocean">

  <a class="skip-link" href="#player-main">Skip to player</a>
  <a class="backtohome" href="index.html">Back to Home</a>

  <div id="bg-media" class="bg-media" aria-hidden="true">
    <video id="bg-video" preload="none" muted loop playsinline></video>
    <div class="bg-poster"></div>
    <div class="bg-loading-spinner" aria-hidden="true"></div>
    <p class="bg-error-msg" role="alert" hidden>Video unavailable</p>
  </div>

  <main id="player-main" class="player-wrapper" aria-label="Frank Ocean music player">
    <div class="player-loading-overlay" hidden aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <canvas id="song-canvas" width="400" height="250" aria-label="Audio visualizer"></canvas>

    <div class="song-info">
      <h1 id="song-title" class="song-title">Loading…</h1>
      <p id="artist-name" class="artist-name">Frank Ocean</p>
      <p id="now-playing-meta" class="now-playing-meta" aria-live="polite"></p>
    </div>

    <div class="progress-container">
      <span id="time-display" class="time-display" aria-live="off">0:00 / 0:30</span>
      <div class="progress-track-wrapper">
        <div id="buffer-bar" class="buffer-bar" aria-hidden="true"></div>
        <input type="range" id="progress-bar" value="0" min="0" step="0.1" aria-label="Seek through track" />
        <span id="scrub-tooltip" class="scrub-tooltip" hidden>0:00</span>
      </div>
    </div>

    <div class="player-controls" role="group" aria-label="Playback controls">
      <div class="controls-row controls-primary">
        <button type="button" class="control-btn btn-backward" aria-label="Previous track">
          <i class="fa-solid fa-backward" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-play" aria-label="Play">
          <i class="fa-solid fa-play" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-pause" hidden aria-label="Pause">
          <i class="fa-solid fa-pause" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-forward" aria-label="Next track">
          <i class="fa-solid fa-forward" aria-hidden="true"></i>
        </button>
      </div>
      <div class="controls-row controls-secondary">
        <button type="button" class="control-btn btn-repeat" data-mode="off" aria-label="Repeat mode" aria-pressed="false">
          <i class="fa-solid fa-repeat" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-vol-down" aria-label="Volume down">
          <i class="fa-solid fa-volume-low" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-mute" aria-label="Mute or unmute">
          <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
        </button>
        <span id="volume-display" class="volume-display" aria-live="polite">70%</span>
        <button type="button" class="control-btn btn-vol-up" aria-label="Volume up">
          <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
        </button>
        <button type="button" class="control-btn btn-shuffle" aria-label="Toggle shuffle" aria-pressed="false">
          <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </main>

  <script src="video-background.js"></script>
  <script src="audio-player.js"></script>
  <script src="visualizer-images.js"></script>
  <script src="player-core.js"></script>
  <script src="frankocean.js"></script>
</body>
</html>
