<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Midnight Vinyl</title>
  <link rel="stylesheet" href="style.css?v=20250630" />
  <style>
    /* Inline fallback — works even if cached CSS is stale */
    #bg-video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0; pointer-events: none;
    }
    body { background: transparent !important; }
    html { background: #030208; }
    #main-content { position: relative; z-index: 2; }
  </style>
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <video id="bg-video"
    src="homebackground.mp4"
    autoplay muted loop playsinline webkit-playsinline
    preload="auto"></video>

  <main id="main-content">
    <header class="hero">
      <span class="hero-badge">Portfolio · Music Player · Build 20250630</span>
      <h1 class="vapor-heading">Midnight Vinyl</h1>
      <p class="vapor-sub">Pick an artist below — each page has a video background and 30-second iTunes previews.</p>
    </header>

    <div class="artist-grid">
      <a href="weeknd.html" class="artist-card artist-card--weeknd">
        <div class="artist-card__img-wrap">
          <img src="weekndphoto.PNG" alt="The Weeknd" class="artist-card__img" />
        </div>
        <div class="artist-card__body">
          <div class="artist-card__name">The Weeknd</div>
          <span class="artist-card__cta">Enter player →</span>
        </div>
      </a>

      <a href="frankocean.html" class="artist-card artist-card--frank">
        <div class="artist-card__img-wrap">
          <img src="frankphoto.PNG" alt="Frank Ocean" class="artist-card__img" />
        </div>
        <div class="artist-card__body">
          <div class="artist-card__name">Frank Ocean</div>
          <span class="artist-card__cta">Enter player →</span>
        </div>
      </a>

      <a href="mj.html" class="artist-card artist-card--mj">
        <div class="artist-card__img-wrap">
          <img src="mjphoto.PNG" alt="Michael Jackson" class="artist-card__img" />
        </div>
        <div class="artist-card__body">
          <div class="artist-card__name">Michael Jackson</div>
          <span class="artist-card__cta">Enter player →</span>
        </div>
      </a>
    </div>
  </main>

  <script src="video-background.js?v=20250630"></script>
  <script>initVideoBackground();</script>
</body>
</html>
